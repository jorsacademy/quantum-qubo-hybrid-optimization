[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-qubo-hybrid-optimization"
version = "0.1.0"
description = "Reproducible QUBO, simulated annealing, classical polishing, and optional D-Wave hybrid/QPU integration"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Jors Academy"}]
dependencies = ["numpy>=1.26,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9"]
dwave = ["dwave-ocean-sdk>=9,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
